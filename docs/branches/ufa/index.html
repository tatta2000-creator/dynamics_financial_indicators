<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Анализ финансовых показателей</title>
  <style>:root {
  color-scheme: light;
  font-family: Arial, sans-serif;
  font-variant-numeric: tabular-nums;
  --page: #edf1f6;
  --panel: #ffffff;
  --text: #172439;
  --muted: #52647a;
  --line: #dce4ee;
  --accent: #3455a0;
  --active: #e3ebfc;
  --good: #087448;
  --bad: #b72f3b;
  --old: #67768a;
  --previous: #087ca8;
  --current: #b95a00;
  --bar: #dae6fa;
  --shadow: #1c32472b;
}

@media screen {
 :root[data-theme="dark"] {
  color-scheme: dark;
  --page: #101722;
  --panel: #192331;
  --text: #e5edf8;
  --muted: #a8b8cc;
  --line: #334256;
  --accent: #b0c6ff;
  --active: #2d4165;
  --good: #62d9a0;
  --bad: #ff8e98;
  --old: #a2b1c6;
  --previous: #43c6f3;
  --current: #ffad42;
  --bar: #304569;
  --shadow: #0007;
 }
}

* { box-sizing: border-box; }
body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; background: var(--page); color: var(--text); }
button { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.page-title, main { width: min(100% - 36px, 1760px); margin-inline: auto; }
main { display: flex; flex: 1; flex-direction: column; }
.page-title { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 0 8px; }
h1 { min-width: 0; overflow-x: auto; white-space: nowrap; margin: 0; font-size: clamp(18px, 1.9vw, 28px); line-height: 1.2; }
.page-actions { display: flex; flex-shrink: 0; gap: 5px; }
.filters { position: sticky; top: 0; z-index: 3; display: grid; grid-template-columns: minmax(0, 1fr) minmax(310px, 360px); align-items: start; gap: 14px; padding: 6px 0 9px; background: var(--page); }
.branch-control, .period-control { min-width: 0; }
#branch-label, .period-label { display: flex; min-height: 19px; font-size: 12px; color: var(--muted); }
.branches { display: flex; gap: 3px; overflow-x: auto; }
.branches button { flex: none; white-space: nowrap; }
.branches button:focus-visible { outline-offset: -2px; }
.period-label { justify-content: space-between; gap: 6px; }
#period-hint { font-size: 11px; }
.months { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; }
.filters button, .page-actions button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 7px; font-size: 12px; }
.months button { padding-inline: 0; }
.filters button[aria-pressed="true"] { background: var(--active); color: var(--accent); border-color: var(--accent); font-weight: bold; }
#theme { white-space: nowrap; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; margin-bottom: 9px; }
.panel { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.kpi-name { color: var(--muted); font-size: 12px; margin: 0; }
.kpi-value { font-size: clamp(16px, 2.1vw, 26px); font-weight: 700; margin: 4px 0; }
.kpi-deltas { display: flex; flex-wrap: wrap; gap: 3px 12px; min-height: 14px; font-size: 11px; color: var(--muted); }
.positive { color: var(--good); }
.negative { color: var(--bad); }
.reports { display: grid; flex: 1; grid-template-columns: minmax(0, 1fr) minmax(0, 1.18fr); gap: 9px; padding-bottom: 10px; }
.reports-column { display: grid; align-content: start; gap: 9px; min-width: 0; }
@media print, (min-width: 821px) {
  .filters.scoped { grid-template-columns: minmax(310px, 360px); justify-content: end; }
  .reports { grid-template-rows: repeat(3, auto); }
  .reports-column { grid-row: span 3; grid-template-rows: subgrid; align-content: stretch; }
  .trend { display: flex; flex-direction: column; }
  .trend-plot { flex: 1; min-height: clamp(112px, 15.75vh, 205px); }
  .trend-plot svg { position: absolute; inset: 0; height: 100%; }
}
.panel h2 { margin: 0 0 4px; font-size: 13px; line-height: 1.25; }
.chart-legend, .composition-legend { display: flex; flex-wrap: wrap; gap: 3px 10px; color: var(--muted); font-size: 10px; }
.chart-legend { justify-content: flex-end; }
.legend-mark { display: inline-block; width: 9px; height: 7px; margin-right: 3px; background: currentColor; border-radius: 2px; }
.trend-plot { position: relative; }
.trend-plot svg { display: block; width: 100%; overflow: visible; }
.axis-label { fill: var(--muted); font-size: 10px; }
.series { fill: none; stroke: currentColor; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.current .series { stroke-width: 2.6; }
.previous { color: var(--previous); }
.old { color: var(--old); }
.current { color: var(--current); }
.point { fill: var(--panel); stroke: currentColor; vector-effect: non-scaling-stroke; }
.chart-hitboxes { position: absolute; inset: 0 0 0 5.15%; display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)) minmax(0, .78fr); }
.chart-hitboxes button { padding: 0; background: transparent; border: 0; }
.chart-tooltip { position: absolute; z-index: 2; top: 3px; width: max-content; max-width: 100%; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; box-shadow: 0 3px 10px var(--shadow); font-size: 12px; line-height: 1.5; }
.chart-tooltip span { display: block; }
.table-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; white-space: nowrap; font-size: 11px; }
th, td { padding: 3px 5px; text-align: right; border-bottom: 1px solid var(--line); }
thead th { color: var(--muted); font-size: 10px; font-weight: 600; }
th:first-child { text-align: left; }
tbody th { font-weight: 500; }
.row-label { white-space: normal; }
.amount-bar { background-image: linear-gradient(to right, var(--bar) var(--bar-width), transparent 0); font-weight: 700; }
.expand { border: 0; padding: 0; background: transparent; text-align: left; font-weight: 700; }
.expand::before { content: "▸"; color: var(--accent); display: inline-block; width: 12px; }
.expand[aria-expanded="true"]::before { content: "▾"; }
.expense-detail th { padding-left: 17px; }
.composition { display: flex; flex-direction: column; }
.composition-legend { margin: 6px 0 8px; }
.composition-bars { display: grid; flex: 1; grid-template-rows: repeat(3, minmax(27px, 1fr)); gap: 6px; }
.composition-row { display: grid; grid-template-columns: 32px minmax(0, 1fr); column-gap: 6px; font-size: 11px; color: var(--muted); }
.composition-row > strong { align-self: center; }
.composition-track { display: flex; align-items: stretch; background: var(--page); border-radius: 4px; overflow: hidden; }
.composition-track > span { display: grid; place-items: center; min-width: 0; overflow: hidden; color: #fff; font-size: 10px; font-weight: 700; }
.composition-empty { align-self: center; padding-left: 4px; }

@media screen and (max-width: 820px) {
  .page-title, main { width: calc(100% - 18px); }
  .filters { grid-template-columns: minmax(0, 1fr); gap: 5px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .reports { grid-template-columns: minmax(0, 1fr); }
  .reports-column { gap: 8px; }
  .trend-plot svg { height: 145px; }
  .axis-label { font-size: 12px; }
  table { min-width: 570px; }
  th, td { padding-block: 4px; }
  tr > th:first-child { position: sticky; left: 0; z-index: 1; min-width: 100px; max-width: 155px; background: var(--panel); }
}

@page {
  size: A4 landscape;
  margin: 7mm;
}

@media print {
  body { display: block; min-height: 0; background: white; print-color-adjust: exact; }
  .page-title, main { width: 100%; }
  main { display: block; }
  .page-title { padding: 0 0 8px; }
  h1 { font-size: 22px; overflow: visible; white-space: normal; }
  .page-actions, .filters, .chart-hitboxes, .chart-tooltip, tbody[id^="expense-detail-"] { display: none !important; }
  .kpis { break-inside: avoid; }
  .kpi-value { font-size: 21px; }
  .panel { break-inside: avoid; }
  .reports { padding-bottom: 0; }
  .trend-plot { min-height: 125px; }
  .table-scroll { overflow: visible; }
  .expand::before { display: none; }
}
</style>
</head>
<body>
  <header class="page-title">
    <h1 id="heading" aria-live="polite">Анализ финансовых показателей</h1>
    <div class="page-actions">
      <button id="print" type="button">Печать</button>
      <button id="theme" type="button" aria-pressed="false">Тёмная тема</button>

  <script type="module">const EMPTY_PERIOD = {
  available: false,
  revenue: 0,
  returns: 0,
  expense: 0,
  taxes: 0,
  beforeTax: 0,
  afterTax: 0,
};

function addAmount(map, key, amount) {
  map.set(key, (map.get(key) ?? 0) + amount);
}

function summarize(months) {
  const result = {
    ...EMPTY_PERIOD,
    available: months.length > 0,
    categories: new Map(),
    expenses: new Map(),
  };
  for (const { amounts } of months) {
    for (const [kind, article, detail, amount] of amounts) {
      switch (kind) {
        case "revenue":
          addAmount(result.categories, article, amount);
          break;
        case "expense":
          if (!result.expenses.has(article)) result.expenses.set(article, new Map());
          addAmount(result.expenses.get(article), detail, amount);
          result.expense += amount;
          break;
        case "returns":
          result.returns += amount;
          break;
        case "taxes":
          result.taxes += amount;
          break;
      }
    }
  }
  result.revenue = sumValues(result.categories) + result.returns;
  result.beforeTax = result.revenue - result.expense;
  result.afterTax = result.beforeTax + result.taxes;
  return result;
}

function sumValues(map) {
  return map ? Array.from(map.values()).reduce((sum, value) => sum + value, 0) : 0;
}

function ratio(value, base) {
  return value === null || !base ? null : value / base;
}

function comparison(current, previous, expense) {
  const delta = current === null || previous === null ? null : current - previous;
  return {
    delta,
    growth: ratio(delta, Math.abs(previous)),
    direction: delta === null ? null : Math.sign(expense ? -delta : delta) || 0,
  };
}

function valuesAndComparisons(periods, getValue, expense = false) {
  const values = periods.map((period) => period.available ? getValue(period) : null);
  return {
    values,
    comparisons: values.slice(1).map((previous) => comparison(values[0], previous, expense)),
  };
}

const METRICS = ["revenue", "expense", "beforeTax", "afterTax"];

function metrics(periods) {
  return Object.fromEntries(METRICS.map((name) => [
    name, valuesAndComparisons(periods, (period) => period[name], name === "expense"),
  ]));
}

function revenueStructure(periods, categories) {
  const rows = categories
    .filter((name) => name !== "Кафе" || periods.some((period) => period.categories.has(name)))
    .map((name, index) => {
      const row = valuesAndComparisons(periods, (period) => period.categories.get(name) ?? 0);
      return {
        name,
        ...row,
        ticketRates: row.values.slice(0, 2).map((value, i) => {
          const { categories: categoryTotals } = periods[i];
          const tickets = (categoryTotals.get(categories[0]) ?? 0)
            + (categoryTotals.get(categories[1]) ?? 0);
          return index < 2 ? null : ratio(value, tickets);
        }),
        shares: row.values.map((value, i) => ratio(value, sumValues(periods[i].categories))),
      };
    });
  return rows;
}

function expenseRow(name, periods, getValue) {
  const row = valuesAndComparisons(periods, getValue, true);
  return {
    name,
    ...row,
    shares: row.values.slice(0, 2).map((value, i) => ratio(value, periods[i].expense)),
  };
}

function descendingExpense(first, second) {
  return (second.values[0] ?? 0) - (first.values[0] ?? 0)
    || first.name.localeCompare(second.name, "ru");
}

function expenseStructure(periods) {
  const names = new Set(periods.flatMap((period) => Array.from(period.expenses.keys())));
  return Array.from(names, (name) => {
    const details = new Set(periods.flatMap(
      (period) => Array.from(period.expenses.get(name)?.keys() ?? []),
    ));
    return {
      ...expenseRow(name, periods, (period) => sumValues(period.expenses.get(name))),
      details: Array.from(details, (detail) => expenseRow(
        detail, periods, (period) => period.expenses.get(name)?.get(detail) ?? 0,
      )).sort(descendingExpense),
    };
  }).sort(descendingExpense);
}

export function dashboardReport(data, { branchCode = null, start = data.latestMonth, end = start } = {}) {
  if (!Number.isInteger(start) || !Number.isInteger(end) || start < 1 || end > 12 || start > end) {
    throw new RangeError("Проверьте начало и конец периода");
  }
  const branches = data.branches.filter((branch) => branchCode === null || branch.code === branchCode);
  if (!branches.length) throw new RangeError("Филиал отсутствует в отчёте");

  const years = [data.year, data.year - 1, data.year - 2];
  const months = branches.flatMap((branch) => branch.months);
  const periods = years.map((year) => summarize(
    months.filter((item) => item.year === year && item.month >= start && item.month <= end),
  ));
  return {
    years,
    start,
    end,
    kpis: metrics(periods),
    revenue: revenueStructure(periods, data.revenueCategories),
    expenses: expenseStructure(periods),
    trend: Array.from({ length: 12 }, (_, index) => {
      const month = index + 1;
      return {
        month,
        metrics: metrics(years.map((year) => summarize(
          months.filter((item) => item.year === year && item.month === month),
        ))),
      };
    }),
  };
}

const data = JSON.parse(document.getElementById("dashboard-data").textContent);
const MONTHS = "Янв Фев Мар Апр Май Июн Июл Авг Сен Окт Ноя Дек".split(" ");
const METRIC_LABELS = {
  revenue: "Выручка",
  expense: "Операционные расходы",
  beforeTax: "ОП до налогов",
  afterTax: "ОП после налогов",
};
const LINE_LABELS = {
  revenue: "Динамика выручки",
  expense: "Динамика операционных расходов",
  beforeTax: "Динамика ОП до налогов",
};
const SERIES = ["current", "previous", "old"];
const COMPOSITION_COLORS = ["#253e87", "#086b84", "#206c9c", "#5954a1", "#58677b"];
const RUBLES = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 0 });
const MILLIONS = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 2 });
const PERCENT = [0, 1, 2].map((digits) => new Intl.NumberFormat("ru-RU", {
  style: "percent", minimumFractionDigits: digits, maximumFractionDigits: digits,
}));
const byId = (id) => document.getElementById(id);
const state = { branchCode: data.branchCode ?? null, start: data.latestMonth, end: data.latestMonth, anchor: null };

function escape(text) {
  return String(text).replace(/[&<>"']/g, (character) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[character]);
}

function money(value, millions = false) {
  if (value === null) return "—";
  return millions ? MILLIONS.format(value / 1e6) : RUBLES.format(value);
}

function percent(value, digits, signed = false) {
  return value === null ? "—" : (signed && value > 0 ? "+" : "") + PERCENT[digits].format(value);
}

function movement(direction) {
  return direction > 0 ? "positive" : direction < 0 ? "negative" : "";
}

function periodLabel({ start, end, years }) {
  const first = MONTHS[start - 1].toLowerCase();
  const last = MONTHS[end - 1].toLowerCase();
  return `${first}${start === end ? "" : `–${last}`} ${years[0]}`;
}

function shortYear(year) {
  return String(year).slice(-2);
}

function renderKpis(report) {
  byId("kpis").innerHTML = Object.entries(report.kpis).map(([metric, { values, comparisons }]) => {
    const deltas = comparisons.map(({ growth, direction }, index) => growth === null ? "" :
      `<span class="${movement(direction)}">YoY${shortYear(report.years[index + 1])} ${percent(growth, 1, true)}</span>`);
    return `<article class="panel kpi" data-metric="${metric}">
      <p class="kpi-name">${METRIC_LABELS[metric]}, руб.</p>
      <p class="kpi-value">${money(values[0])}</p>
      <div class="kpi-deltas">${deltas.join("")}</div>
    </article>`;
  }).join("");
}

function plotScale(values) {
  const low = Math.min(0, ...values);
  const high = Math.max(0, ...values);
  const rough = (high - low) / 4 || 1e6;
  const magnitude = 10 ** Math.floor(Math.log10(rough));
  const step = [1, 2, 2.5, 5, 10].find((factor) => factor * magnitude >= rough) * magnitude;
  const first = Math.floor(low / step);
  const last = Math.ceil(high / step) || 1;
  return { min: first * step, max: last * step, ticks: Array.from(
    { length: last - first + 1 }, (_, i) => (first + i) * step,
  ) };
}

function trendChart(report, metric, branchName) {
  const values = report.trend.map((item) => item.metrics[metric].values);
  const { min, max, ticks } = plotScale(values.flat().filter((value) => value !== null));
  const x = (index) => 57 + index * (550 / 11);
  const y = (value) => 102 - (value - min) * 94 / (max - min);
  const valueLabels = ticks.map((value) =>
    `<text class="axis-label" x="51" y="${y(value) + 3}" text-anchor="end">${money(value, true)}</text>`);
  const monthLabels = MONTHS.map((month, index) =>
    `<text class="axis-label" x="${x(index)}" y="117" text-anchor="middle">${month}</text>`);
  const series = [2, 1, 0].map((yearIndex) => {
    let previousExists = false;
    const dots = [];
    const path = values.map((months, i) => {
      const value = months[yearIndex];
      const command = previousExists ? "L" : "M";
      previousExists = value !== null;
      if (!previousExists) return "";
      dots.push(`<circle class="point" cx="${x(i)}" cy="${y(value)}" r="${yearIndex === 0 ? 3 : 2.3}"/>`);
      return `${command}${x(i)} ${y(value)}`;
    }).join(" ");
    return `<g class="${SERIES[yearIndex]}" data-year="${report.years[yearIndex]}">
      <path class="series" d="${path}"/>${dots.join("")}</g>`;
  });
  return `<article class="panel trend" data-metric="${metric}">
    <h2>${LINE_LABELS[metric]}, руб. · ${escape(branchName)}</h2>
    <div class="chart-legend" aria-hidden="true">${[2, 1, 0].map((index) =>
      `<span><i class="legend-mark ${SERIES[index]}"></i>${report.years[index]}</span>`).join("")}</div>
    <div class="trend-plot">
      <svg viewBox="0 0 621 121" preserveAspectRatio="none" aria-hidden="true">
        <text class="axis-label" x="2" y="12">млн</text>
        ${valueLabels.join("")}${monthLabels.join("")}${series.join("")}
      </svg>
      <div class="chart-hitboxes">${MONTHS.map((month, index) =>
        `<button type="button" data-month="${index}" aria-label="${month}" aria-describedby="tooltip-${metric}"></button>`).join("")}</div>
      <div id="tooltip-${metric}" class="chart-tooltip" role="tooltip" hidden></div>
    </div>
  </article>`;
}

function renderTrends(report, branchName) {
  const trends = byId("trends");
  trends.innerHTML = Object.keys(LINE_LABELS).map((metric) => trendChart(report, metric, branchName)).join("");
  for (const chart of trends.querySelectorAll(".trend")) {
    const plot = chart.querySelector(".trend-plot");
    const tooltip = chart.querySelector(".chart-tooltip");
    const buttons = plot.querySelectorAll("button");
    const show = (button) => {
      const index = Number(button.dataset.month);
      const { values, comparisons } = report.trend[index].metrics[chart.dataset.metric];
      const readings = [2, 1, 0].map((i) => `<span><i class="legend-mark ${SERIES[i]}"></i>
        ${report.years[i]} · ${money(values[i])}${values[i] === null ? "" : " руб."}</span>`);
      const deltas = comparisons.map(({ growth, direction }, i) => growth === null ? "" :
        `<span class="${movement(direction)}">${shortYear(report.years[0])}/${shortYear(report.years[i + 1])} · ${percent(growth, 1, true)}</span>`);
      tooltip.innerHTML = `<strong>${MONTHS[index]}</strong>${readings.join("")}${deltas.join("")}`;
      tooltip.hidden = false;
      const anchor = button.getBoundingClientRect().left - plot.getBoundingClientRect().left;
      tooltip.style.left = `${Math.max(0, Math.min(anchor + 9, plot.clientWidth - tooltip.offsetWidth))}px`;
    };
    for (const button of buttons) {
      button.addEventListener("pointerenter", (event) => { if (event.pointerType === "mouse") show(button); });
      button.addEventListener("focus", () => show(button));
      button.addEventListener("click", () => show(button));
    }
    plot.addEventListener("pointerleave", () => { tooltip.hidden = true; });
    plot.addEventListener("focusout", (event) => { if (!plot.contains(event.relatedTarget)) tooltip.hidden = true; });
    plot.addEventListener("keydown", (event) => { if (event.key === "Escape") tooltip.hidden = true; });
  }
}

function comparisonCells(comparisons) {
  return comparisons.map(({ delta, growth, direction }) =>
    `<td class="${movement(direction)}">${delta > 0 ? "+" : ""}${money(delta, true)}</td>
     <td class="${movement(direction)}">${percent(growth, 2, true)}</td>`).join("");
}

function tableRow(row, title, scale, extraValues, digits, attributes = "") {
  const value = row.values[0];
  return `<tr${attributes}><th class="row-label" scope="row">${title}</th>
    <td class="amount-bar" style="--bar-width:${scale && value !== null ? 100 * Math.abs(value) / scale : 0}%">${money(value, true)}</td>
    ${comparisonCells(row.comparisons)}
    ${extraValues.map((figure) => `<td>${percent(figure, digits)}</td>`).join("")}</tr>`;
}

function structureTable(rows, years, context, expense = false) {
  const title = expense ? "Структура расходов" : "Структура выручки";
  const column = expense ? "Вид расхода" : "Вид выручки";
  const share = expense ? "Доля" : "% к билетам";
  const maximum = Math.max(0, ...rows.map((row) => Math.abs(row.values[0] ?? 0)));
  const comparisons = years.slice(1).map((year) => {
    const label = `${shortYear(years[0])}/${shortYear(year)}`;
    return `<th scope="col">${label}</th><th scope="col">${label}, %</th>`;
  }).join("");
  const body = rows.map((row, i) => {
    const name = escape(row.name);
    if (!expense) return tableRow(row, name, maximum, row.ticketRates, 2);
    const heading = `<button class="expand" type="button" data-expense="${i}" aria-expanded="false" aria-controls="expense-detail-${i}">${name}</button>`;
    const detailMax = Math.max(0, ...row.details.map((item) => Math.abs(item.values[0] ?? 0)));
    const details = row.details.map((item) =>
      tableRow(item, escape(item.name), detailMax, item.shares, 1, ' class="expense-detail"')).join("");
    return `<tbody>${tableRow(row, heading, maximum, row.shares, 1)}</tbody>
      <tbody id="expense-detail-${i}" hidden>${details}</tbody>`;
  }).join("");
  return `<article class="panel structure">
    <h2>${title}, млн руб. · ${context}</h2>
    <div class="table-scroll" tabindex="0" role="region" aria-label="${title}"><table>
      <thead><tr><th scope="col">${column}</th><th scope="col">${years[0]}</th>${comparisons}
        <th scope="col">${share}<br>${years[0]}</th><th scope="col">${share}<br>${years[1]}</th>
      </tr></thead>${expense ? body || '<tbody><tr><td colspan="8">Данных нет</td></tr></tbody>' : `<tbody>${body}</tbody>`}
    </table></div>
  </article>`;
}

function compositionChart(report, context) {
  const rows = report.revenue.map((row) => ({
    ...row, color: COMPOSITION_COLORS[data.revenueCategories.indexOf(row.name)],
  }));
  const legend = rows.map(({ name, color }) => `<span><i class="legend-mark" style="color:${color}"></i>${escape(name)}</span>`);
  const bars = report.years.map((year, i) => {
    const segments = rows.filter(({ shares }) => shares[i] > 0).map(({ name, color, shares }) => {
      const share = shares[i];
      return `<span style="width:${share * 100}%;background:${color}" title="${escape(name)} · ${percent(share, 2)}"
        aria-label="${escape(name)} · ${percent(share, 2)}">${share >= .06 ? percent(share, 0) : ""}</span>`;
    });
    return `<div class="composition-row"><strong>${year}</strong><div class="composition-track">${segments.join("") ||
      '<small class="composition-empty">Данных нет</small>'}</div></div>`;
  });
  return `<article class="panel composition"><h2>Изменение структуры выручки · ${context}</h2>
    <div class="composition-legend">${legend.join("")}</div>
    <div class="composition-bars">${bars.join("")}</div></article>`;
}

function render(includeTrends = false) {
  const report = dashboardReport(data, state);
  const branchName = data.branches.find((branch) => branch.code === state.branchCode)?.name ?? "Все филиалы";
  const context = `${branchName} · ${periodLabel(report)}`;
  const heading = `Анализ финансовых показателей · ${context}`;
  byId("heading").textContent = heading;
  document.title = heading;
  for (const button of byId("branches").children) {
    button.setAttribute("aria-pressed", (button.dataset.branch || null) === state.branchCode);
  }
  for (const button of byId("months").children) {
    const month = Number(button.dataset.month);
    button.setAttribute("aria-pressed", month >= state.start && month <= state.end);
  }
  byId("period-hint").textContent = state.anchor === null ? "Выберите начало периода" : "Выберите конец периода";
  renderKpis(report);
  const title = escape(context);
  byId("structures").innerHTML = structureTable(report.revenue, report.years, title)
    + structureTable(report.expenses, report.years, title, true) + compositionChart(report, title);
  if (includeTrends) renderTrends(report, branchName);
}

const branchControl = byId("branches");
if (data.branchCode) {
  branchControl.closest(".branch-control").hidden = true;
  branchControl.closest(".filters").classList.add("scoped");
} else {
  branchControl.innerHTML = [{ code: "", name: "Все" }, ...data.branches]
    .map(({ code, name }) => `<button type="button" data-branch="${escape(code)}">${escape(name)}</button>`).join("");
  branchControl.addEventListener("click", (event) => {
    const button = event.target.closest("[data-branch]");
    if (!button) return;
    state.branchCode = button.dataset.branch || null;
    render(true);
  });
}
byId("months").innerHTML = MONTHS.map((name, index) =>
  `<button type="button" data-month="${index + 1}">${name.toLowerCase()}</button>`).join("");
byId("months").addEventListener("click", (event) => {
  const button = event.target.closest("button");
  if (!button) return;
  const month = Number(button.dataset.month);
  if (state.anchor === null) {
    state.start = state.end = state.anchor = month;
  } else {
    state.start = Math.min(state.anchor, month);
    state.end = Math.max(state.anchor, month);
    state.anchor = null;
  }
  render();
});
byId("structures").addEventListener("click", (event) => {
  const button = event.target.closest("[data-expense]");
  if (!button) return;
  const expanded = button.getAttribute("aria-expanded") === "true";
  button.setAttribute("aria-expanded", !expanded);
  byId(button.getAttribute("aria-controls")).hidden = expanded;
});

function applyTheme(dark) {
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  byId("theme").setAttribute("aria-pressed", dark);
  byId("theme").textContent = dark ? "Светлая тема" : "Тёмная тема";
}

const themeKey = "dynamics-financial-indicators-theme";
try {
  applyTheme(localStorage.getItem(themeKey) === "dark");
} catch {
  applyTheme(false);
}
byId("theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme !== "dark";
  applyTheme(dark);
  try { localStorage.setItem(themeKey, dark ? "dark" : "light"); } catch { /* Local storage is optional. */ }
});
byId("print").addEventListener("click", () => window.print());
render(true);
</script>
</body>
</html>
